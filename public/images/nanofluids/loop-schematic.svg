<g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="6">
<path stroke="#8fbaba" d="M202 240H95Q76 240 76 221V122Q76 106 92 106H180"/>
<path stroke="#db946a" d="M330 106H391Q406 106 406 121V224Q406 240 390 240H322"/>
</g>
<g fill="#8fbaba"><path d="m70 148 6-12 6 12zM140 99l12 7-12 7zM151 233l-12 7 12 7z"/></g>
<g fill="#db946a"><path d="m366 99 12 7-12 7zM399 169l7 12 7-12z"/></g>
