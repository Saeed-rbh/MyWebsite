<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
<title>A closed cooling loop</title><desc>The pump drives cool fluid upward to the cold plate. Warm fluid exits on the right and passes through the radiator before returning to the pump.</desc>
