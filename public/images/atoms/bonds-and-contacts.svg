<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>04 / Two meanings of “bond”</title><defs><radialGradient id="O" cx="30%" cy="25%"><stop stop-color="#ffcab0"/><stop offset="1" stop-color="#a73738"/></radialGradient><radialGradient id="H"><stop stop-color="#fffdf1"/><stop offset="1" stop-color="#c4ac91"/></radialGradient></defs><rect width="960" height="540" rx="16" fill="#1c1713"/><g font-family="Arial,sans-serif"><text x="42" y="52" fill="#f0dcc8" font-size="28" text-anchor="start">04 / Two meanings of “bond”</text><g transform="translate(210,240) scale(1.15)"><line x1="0" y1="0" x2="-65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><line x1="0" y1="0" x2="65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><circle cx="0" cy="0" r="30" fill="url(#O)"/><text x="0" y="6" fill="#fff" font-size="20" text-anchor="middle">O</text><circle cx="-65" cy="50" r="20" fill="url(#H)"/><text x="-65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text><circle cx="65" cy="50" r="20" fill="url(#H)"/><text x="65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text></g><g transform="translate(470,340) scale(0.9)"><line x1="0" y1="0" x2="-65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><line x1="0" y1="0" x2="65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><circle cx="0" cy="0" r="30" fill="url(#O)"/><text x="0" y="6" fill="#fff" font-size="20" text-anchor="middle">O</text><circle cx="-65" cy="50" r="20" fill="url(#H)"/><text x="-65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text><circle cx="65" cy="50" r="20" fill="url(#H)"/><text x="65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text></g><line x1="285" y1="297" x2="445" y2="338" stroke="#8fc9c6" stroke-width="4" stroke-dasharray="6 7"/><text x="90" y="160" fill="#f0dcc8" font-size="23" text-anchor="start">Within a molecule</text><text x="90" y="190" fill="#cdbfb1" font-size="18" text-anchor="start">Solid O–H covalent bond</text><text x="590" y="180" fill="#f0dcc8" font-size="23" text-anchor="start">Between molecules</text><text x="590" y="225" fill="#cdbfb1" font-size="20" text-anchor="start">Hydrogen bonding depends</text><text x="590" y="255" fill="#cdbfb1" font-size="20" text-anchor="start">on distance and orientation.</text><text x="590" y="315" fill="#8fc9c6" font-size="20" text-anchor="start">It is not a new O–H</text><text x="590" y="345" fill="#8fc9c6" font-size="20" text-anchor="start">covalent bond.</text><text x="42" y="470" fill="#f0dcc8" font-size="19" text-anchor="start">In ordinary fixed-topology water models, O–H bonds do not form or break.</text><text x="42" y="505" fill="#bca997" font-size="16" text-anchor="start">Teaching schematic • dashed line indicates an intermolecular contact</text></g></svg>