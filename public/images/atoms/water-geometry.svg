<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>01 / Water has a bent molecular structure</title><defs><radialGradient id="O" cx="30%" cy="25%"><stop stop-color="#ffcab0"/><stop offset="1" stop-color="#a73738"/></radialGradient><radialGradient id="H"><stop stop-color="#fffdf1"/><stop offset="1" stop-color="#c4ac91"/></radialGradient></defs><rect width="960" height="540" rx="16" fill="#1c1713"/><g font-family="Arial,sans-serif"><text x="42" y="52" fill="#f0dcc8" font-size="28" text-anchor="start">01 / Water has a bent molecular structure</text><g transform="translate(260,230) scale(1.7)"><line x1="0" y1="0" x2="-65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><line x1="0" y1="0" x2="65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><circle cx="0" cy="0" r="30" fill="url(#O)"/><text x="0" y="6" fill="#fff" font-size="20" text-anchor="middle">O</text><circle cx="-65" cy="50" r="20" fill="url(#H)"/><text x="-65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text><circle cx="65" cy="50" r="20" fill="url(#H)"/><text x="65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text></g><text x="260" y="175" fill="#e8907d" font-size="20" text-anchor="middle">Oxygen</text><text x="260" y="395" fill="#f0dcc8" font-size="28" text-anchor="middle">104.52°</text><text x="260" y="430" fill="#bca997" font-size="18" text-anchor="middle">Reference H–O–H angle</text><text x="570" y="175" fill="#f0dcc8" font-size="23" text-anchor="start">2 hydrogen atoms + 1 oxygen</text><text x="570" y="225" fill="#cdbfb1" font-size="21" text-anchor="start">O–H distance ≈ 0.9572 Å</text><text x="570" y="270" fill="#cdbfb1" font-size="18" text-anchor="start">Geometry shown for TIP4P/2005.</text><text x="570" y="310" fill="#cdbfb1" font-size="18" text-anchor="start">1 Å = 0.1 nanometres</text><text x="570" y="380" fill="#cdbfb1" font-size="18" text-anchor="start">Bond lengths and angles depend</text><text x="570" y="410" fill="#cdbfb1" font-size="18" text-anchor="start">on the chosen water model.</text><text x="42" y="505" fill="#bca997" font-size="16" text-anchor="start">Literature-based schematic • atom sizes are illustrative</text></g></svg>