<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><title>Atomistic models of crystals, molecular matter, and interfaces</title><rect width="960" height="540" rx="16" fill="#1c1713"/><g font-family="Arial,sans-serif"><text x="38" y="52" fill="#f0dcc8" font-size="29">An atomic perspective on matter</text><rect x="32" y="100" width="280" height="385" rx="10" fill="#261e18" stroke="#6d5140"/><text x="50" y="137" fill="#eab58e" font-size="18">CRYSTALS</text><text x="50" y="390" fill="#d4c2b1" font-size="15">Order, defects, deformation</text><text x="50" y="430" fill="#d4c2b1" font-size="15">How does a vacancy</text><text x="50" y="452" fill="#d4c2b1" font-size="15">change a solid?</text><circle cx="72" cy="190" r="9" fill="#d7a27c"/><circle cx="72" cy="236" r="9" fill="#d7a27c"/><circle cx="72" cy="282" r="9" fill="#d7a27c"/><circle cx="72" cy="328" r="9" fill="#d7a27c"/><circle cx="119" cy="190" r="9" fill="#d7a27c"/><circle cx="119" cy="236" r="9" fill="#d7a27c"/><circle cx="119" cy="282" r="9" fill="#d7a27c"/><circle cx="119" cy="328" r="9" fill="#d7a27c"/><circle cx="166" cy="190" r="9" fill="#d7a27c"/><circle cx="166" cy="236" r="12" fill="none" stroke="#89c7c3" stroke-dasharray="3 4"/><circle cx="166" cy="282" r="9" fill="#d7a27c"/><circle cx="166" cy="328" r="9" fill="#d7a27c"/><circle cx="213" cy="190" r="9" fill="#d7a27c"/><circle cx="213" cy="236" r="9" fill="#d7a27c"/><circle cx="213" cy="282" r="9" fill="#d7a27c"/><circle cx="213" cy="328" r="9" fill="#d7a27c"/><circle cx="260" cy="190" r="9" fill="#d7a27c"/><circle cx="260" cy="236" r="9" fill="#d7a27c"/><circle cx="260" cy="282" r="9" fill="#d7a27c"/><circle cx="260" cy="328" r="9" fill="#d7a27c"/><rect x="342" y="100" width="280" height="385" rx="10" fill="#261e18" stroke="#6d5140"/><text x="360" y="137" fill="#eab58e" font-size="18">MOLECULAR MATTER</text><text x="360" y="390" fill="#d4c2b1" font-size="15">Structure, motion, diffusion</text><text x="360" y="430" fill="#d4c2b1" font-size="15">H