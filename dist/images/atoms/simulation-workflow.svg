<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>03 / The workflow behind a molecular-dynamics study</title><defs><radialGradient id="O" cx="30%" cy="25%"><stop stop-color="#ffcab0"/><stop offset="1" stop-color="#a73738"/></radialGradient><radialGradient id="H"><stop stop-color="#fffdf1"/><stop offset="1" stop-color="#c4ac91"/></radialGradient></defs><rect width="960" height="540" rx="16" fill="#1c1713"/><g font-family="Arial,sans-serif"><text x="42" y="52" fill="#f0dcc8" font-size="28" text-anchor="start">03 / The workflow behind a molecular-dynamics study</text><rect x="42" y="145" width="205" height="145" rx="8" fill="#2b211a" stroke="#795b46"/><text x="60" y="185" fill="#d5a27e" font-size="17" text-anchor="start">01</text><text x="60" y="223" fill="#f0dcc8" font-size="24" text-anchor="start">BUILD</text><text x="60" y="260" fill="#cdbfb1" font-size="14" text-anchor="start">Coordinates + topology</text><text x="253" y="225" fill="#8fc9c6" font-size="22" text-anchor="start">→</text><rect x="272" y="145" width="205" height="145" rx="8" fill="#2b211a" stroke="#795b46"/><text x="290" y="185" fill="#d5a27e" font-size="17" text-anchor="start">02</text><text x="290" y="223" fill="#f0dcc8" font-size="24" text-anchor="start">DEFINE</text><text x="290" y="260" fill="#cdbfb1" font-size="14" text-anchor="start">Potential + boundaries</text><text x="483" y="225" fill="#8fc9c6" font-size="22" text-anchor="start">→</text><rect x="502" y="145" width="205" height="145" rx="8" fill="#2b211a" stroke="#795b46"/><text x="520" y="185" fill="#d5a27e" font-size="17" text-anchor="start">03</text><text x="520" y="223" fill="#f0dcc8" font-size="24" text-anchor="start">RELAX</text><text x="520" y="260" fill="#cdbfb1" font-size="14" text-anchor="start">Minimise + equilibrate</text><text x="713" y="225" fill="#8fc9c6" font-size="22" text-anchor="start">→</text><rect x="732" y="145" width="205" height="145" rx="8" fill="#2b211a" stroke="#795b46"/><text x="750" y="185" fill="#d5a27e" font-size="17" text-anchor="start">04</text><text x="750" y="223" fill="#f0dcc8" font-size="24" text-anchor="start">RUN</text><text x="750" y="260" fill="#cdbfb1" font-size="14" text-anchor="start">Integrate + record</text><text x="480" y="355" fill="#f0dcc8" font-size="26" text-anchor="middle">Forces → acceleration → positions → new forces</text><text x="480" y="405" fill="#cdbfb1" font-size="21" text-anchor="middle">Analyse trajectories, estimate uncertainty, compare with evidence.</text><text x="480" y="465" fill="#8fc9c6" font-size="19" text-anchor="middle">Check the model and repeat when the answer changes.</text></g></svg>