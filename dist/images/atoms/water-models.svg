<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>02 / Three atoms do not always mean three interaction sites</title><defs><radialGradient id="O" cx="30%" cy="25%"><stop stop-color="#ffcab0"/><stop offset="1" stop-color="#a73738"/></radialGradient><radialGradient id="H"><stop stop-color="#fffdf1"/><stop offset="1" stop-color="#c4ac91"/></radialGradient></defs><rect width="960" height="540" rx="16" fill="#1c1713"/><g font-family="Arial,sans-serif"><text x="42" y="52" fill="#f0dcc8" font-size="28" text-anchor="start">02 / Three atoms do not always mean three interaction sites</text><g transform="translate(240,210) scale(1.4)"><line x1="0" y1="0" x2="-65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><line x1="0" y1="0" x2="65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><circle cx="0" cy="0" r="30" fill="url(#O)"/><text x="0" y="6" fill="#fff" font-size="20" text-anchor="middle">O</text><circle cx="-65" cy="50" r="20" fill="url(#H)"/><text x="-65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text><circle cx="65" cy="50" r="20" fill="url(#H)"/><text x="65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text></g><g transform="translate(710,210) scale(1.4)"><line x1="0" y1="0" x2="-65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><line x1="0" y1="0" x2="65" y2="50" stroke="#d5ab87" stroke-width="4" stroke-dasharray=""/><circle cx="0" cy="0" r="30" fill="url(#O)"/><text x="0" y="6" fill="#fff" font-size="20" text-anchor="middle">O</text><circle cx="-65" cy="50" r="20" fill="url(#H)"/><text x="-65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text><circle cx="65" cy="50" r="20" fill="url(#H)"/><text x="65" y="56" fill="#3b2b20" font-size="20" text-anchor="middle">H</text></g><text x="240" y="125" fill="#e3b28d" font-size="19" text-anchor="middle">THREE-SITE MODEL</text><text x="710" y="125" fill="#e3b28d" font-size="19" text-anchor="middle">FOUR-SITE MODEL</text><text x="240" y="185" fill="#8fc9c6" font-size="20" text-anchor="middle">δ−</text><text x="130" y="325" fill="#e3b28d" font-size="20" text-anchor="start">δ+</text><text x="325" y="325" fill="#e3b28d" font-size="20" text-anchor="start">δ+</text><line x1="710" y1="235" x2="710" y2="265" stroke="#8fc9c6" stroke-width="4" stroke-dasharray="4 5"/><circle cx="710" cy="265" r="7" fill="#8fc9c6"/><text x="730" y="269" fill="#8fc9c6" font-size="18" text-anchor="start">M / negative charge</text><text x="240" y="390" fill="#cdbfb1" font-size="19" text-anchor="middle">TIP3P: charge on O and H sites</text><text x="710" y="390" fill="#cdbfb1" font-size="19" text-anchor="middle">TIP4P: negative charge on M</text><text x="480" y="455" fill="#f0dcc8" font-size="21" text-anchor="middle">M is a virtual charge site, not a fourth atom.</text><text x="42" y="505" fill="#bca997" font-size="16" text-anchor="start">Literature-based schematic • positions exaggerated for clarity</text></g></svg>