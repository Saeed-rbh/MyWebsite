<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title>A heat-spreading layer above a chip</title><desc>Around an electronic chip. Carry heat across a wider area</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#29221c"/><stop offset="1" stop-color="#121210"/></linearGradient><pattern id="hex" width="52" height="30" patternUnits="userSpaceOnUse"><path d="M0 15 9 0H26L35 15 26 30H9ZM35 15H52" fill="none" stroke="#e8b18a" stroke-width="1.5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#78c8bc"/></marker></defs><rect width="1000" height="480" rx="20" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="44" y="49" font-size="14" letter-spacing="2" fill="#bda58f">SPREAD HEAT</text><rect x="120" y="120" width="260" height="215" rx="15" fill="#344039" stroke="#879389"/><path d="M140 170h220M140 290h220M180 140v175M320 140v175" stroke="#7b897b" stroke-width="3"/><rect x="205" y="190" width="95" height="85" fill="#d98955" stroke="#efbf91" stroke-width="4"/><rect x="685" y="270" width="125" height="65" fill="#d98955"/><path d="M575 225 760 150 930 225 745 300Z" fill="url(#hex)" stroke="#e8b18a" stroke-width="3"/><g stroke="#78c8bc" stroke-width="4" marker-end="url(#arrow)"><path d="m745 230-125-5M755 225l120-5M750 215l10-45"/></g><text x="590" y="110" fill="#e8b18a" font-size="20">Graphene-based heat spreader</text><text x="590" y="375" fill="#78c8bc" font-size="19">Heat still needs an escape path</text><path d="M450 235H540" stroke="#78c8bc" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="424" fill="#f5e4d2" font-size="23">Around an electronic chip</text><text x="570" y="424" fill="#f5e4d2" font-size="23">Carry heat across a wider area</text><text x="44" y="454" fill="#bbaea0" font-size="14">Concept illustration · materials and layers enlarged for clarity</text></g></svg>